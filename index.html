<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Secure Gateway</title>
    <!-- خط عربي مستقبلي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #060814;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .chart-box {
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
        }
        h2 { color: #00f3ff; margin-bottom: 15px; font-size: 18px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-evm { background: linear-gradient(135deg, #f3ba2f, #ff9900); color: #000; }
        .btn-sol { background: linear-gradient(135deg, #9945FF, #14F195); color: #000; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .info-note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1 style="color: #00f3ff; font-size: 22px; letter-spacing: 1px;">NEXUS // SECURE GATEWAY</h1>

    <div class="container">
        <!-- 1. قسم الشارت التفاعلي الحي -->
        <div class="card chart-box">
            <div id="tradingview_widget" style="width:100%;height:100%;"></div>
        </div>

        <!-- 2. قسم الدفع السريع والآمن (بدون عقود وبأعلى تمويه) -->
        <div class="card">
            <h2>اختر وسيلة الدفع</h2>
            
            <!-- زر دفع EVM (BNB / Base) -->
            <!-- ملاحظة: استبدلي العنوان أدناه بعنوان "المحفظة الوسيطة" لإخفاء عنوانك الأساسي -->
            <a href="https://metamask.app.link/send/0xe97836C00f04D3E51aa2Fb17f74B1a29b6bC5334?value=10000000000000000" target="_blank" class="btn btn-evm">
                ⚡ دفع عبر MetaMask (BNB / Base)
            </a>

            <!-- زر دفع Solana -->
            <!-- ملاحظة: استبدلي العنوان أدناه بعنوان "محفظة Solana الوسيطة" -->
            <a href="https://phantom.app/ul/transfer?recipient=H89cRQmD2xQtE6JScerVzYoqZ6qVEQzXPfB8Be67yY5L&amount=0.05" target="_blank" class="btn btn-sol">
                🚀 دفع عبر Phantom (Solana)
            </a>

            <div class="info-note">
                💡 <b>ملاحظة التمويه:</b> لضمان عدم ظهور عنوانك الرئيسي للمستخدمين، ضعي في الروابط أعلاه عنوان "محفظة فرعية وسيطة"، واجعلي الأموال تتجمع فيها قبل تحويلها لمحفظتك الكبرى.
            </div>
        </div>
    </div>

    <!-- كود تشغيل شارت TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BNBUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_widget"
        });
    </script>
</body>
</html>
