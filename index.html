<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رجال اليمن - ملحمة الشجاعة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            background: linear-gradient(135deg, #1a1a1a, #2c1a0f, #0b0b0b);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid #442200;
        }
        .epic-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffaa00;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(255, 170, 0, 0.5);
            animation: fadeInDown 1.5s ease-in-out;
        }
        .epic-subtitle {
            font-size: 1.3rem;
            color: #cccccc;
            max-width: 700px;
            line-height: 1.8;
            padding: 0 20px;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .mountains-bg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, #111, transparent);
            opacity: 0.8;
            z-index: 1;
        }
        .pulse-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,100,0,0.15) 0%, transparent 70%);
            animation: pulse 4s infinite alternate;
            z-index: 0;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="pulse-glow"></div>
        <div class="mountains-bg"></div>
        <h1 class="epic-title">عزم الرجال.. وبأس الجبال</h1>
        <p class="epic-subtitle">هنا تترنح الصخور وتصطف العזائم، رجال اليمن الأوفياء تاريخ ناطق وبطولات تفوق الوصف في ساحات العزة والكرامة.</p>
    </div>

</body>
</html>
