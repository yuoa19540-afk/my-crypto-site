<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الدفع عبر العملات الرقمية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { background: white; padding: 20px; margin: 15px auto; width: 400px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; }
        button:hover { background: #45a049; }
        .info { font-size: 14px; color: #555; word-break: break-all; }
    </style>
</head>
<body>

    <h2>نظام الدفع اللامركزي</h2>

    <!-- قسم شبكات EVM (MetaMask: BNB & Base) -->
    <div class="box">
        <h3>شبكات EVM (BNB / Base)</h3>
        <p class="info">العنوان المستلم: <br><code>0xe97836C00f04D3E51aa2Fb17f74B1a29b6bC5334</code></p>
        <button onclick="connectMetaMask()">ربط MetaMask</button>
        <br>
        <button onclick="payEVM('0.01')">دفع 0.01 (BNB أو ETH حسب الشبكة)</button>
    </div>

    <!-- قسم شبكة Solana -->
    <div class="box">
        <h3>شبكة Solana</h3>
        <p class="info">العنوان المستلم: <br><code>H89cRQmD2xQtE6JScerVzYoqZ6qVEQzXPfB8Be67yY5L</code></p>
        <button onclick="connectSolana()">ربط محفظة Solana</button>
        <br>
        <button onclick="paySolana(0.05)">دفع 0.05 SOL</button>
    </div>

    <script>
        let evmSigner = null;
        let solanaProvider = null;

        // 1. ربط MetaMask لشبكات BNB و Base
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    evmSigner = provider.getSigner();
                    const address = await evmSigner.getAddress();
                    alert("تم بنحاح ربط محفظة EVM: " + address);
                } catch (error) {
                    console.error(error);
                    alert("فشل الاتصال بالمحفظة.");
                }
            } else {
                alert("الرجاء تثبيت إضافة MetaMask.");
            }
        }

        // إرسال الدفعة على شبكات EVM (BNB / Base)
        async function payEVM(amountInEther) {
            if (!evmSigner) {
                alert("الرجاء ربط محفظة MetaMask أولاً!");
                return;
            }
            try {
                const tx = await evmSigner.sendTransaction({
                    to: "0xe97836C00f04D3E51aa2Fb17f74B1a29b6bC5334",
                    value: ethers.utils.parseEther(amountInEther)
                });
                alert("تم إرسال المعاملة بنجاح! رقم المعاملة: " + tx.hash);
            } catch (error) {
                console.error(error);
                حدث خطأ أو تم إلغاء المعاملة.
            }
        }

        // 2. ربط محفظة Solana (مثل Phantom)
        async function connectSolana() {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const response = await window.solana.connect();
                    solanaProvider = window.solana;
                    alert("تم بنجاح ربط محفظة Solana: " + response.publicKey.toString());
                } catch (err) {
                    console.error(err);
                    alert("تم رفض الاتصال.");
                }
            } else {
                alert("الرجاء تثبيت محفظة Phantom أو محفظة متوافقة مع Solana.");
            }
        }

        // إرسال الدفعة على شبكة Solana
        async function paySolana(amountInSOL) {
            if (!solanaProvider || !solanaProvider.isConnected) {
                alert("الرجاء ربط محفظة Solana أولاً!");
                return;
            }
            try {
                const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
                const recipientPubKey = new solanaWeb3.PublicKey("H89cRQmD2xQtE6JScerVzYoqZ6qVEQzXPfB8Be67yY5L");
                
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: solanaProvider.publicKey,
                        toPubkey: recipientPubKey,
                        lamports: amountInSOL * solanaWeb3.LAMPORTS_PER_SOL,
                    })
                );

                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = solanaProvider.publicKey;

                const signed = await solanaProvider.signAndSendTransaction(transaction);
                alert("تم إرسال معاملة سولانا بنجاح! رقم المعاملة: " + signed.signature);
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء تنفيذ الدفع.");
            }
        }
    </script>
</body>
</html>
