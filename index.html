<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance PRO - Live Decentralized Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .bg-card { background-color: #181a20; }
        .bg-darker { background-color: #0b0e11; }
        .text-green-binance { color: #0ecb81; }
        .bg-green-binance { background-color: #0ecb81; }
        .text-red-binance { color: #f6465d; }
        .bg-red-binance { background-color: #f6465d; }
        .border-custom { border-color: #2b313a; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        .floating-alert { animation: fadeInOut 4s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20">

    <!-- Top Header -->
    <header class="bg-card px-4 py-3 border-b border-custom flex items-center justify-between">
        <div class="flex items-center space-x-3 space-x-reverse">
            <span class="text-2xl">⚡</span>
            <div>
                <h1 class="text-base font-bold text-white flex items-center gap-1.5">
                    NEON CAT <span class="text-[10px] bg-yellow-500/20 text-yellow-400 px-1.5 py-0.5 rounded font-normal">MAINNET</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center space-x-3 space-x-reverse text-gray-400 text-sm">
            <span id="connection-status" class="text-xs text-red-400 bg-red-500/10 px-2.5 py-1 rounded-full border border-red-500/20">غير متصل</span>
        </div>
    </header>

    <!-- Floating Live Trade Notification -->
    <div id="live-trade-popup" class="fixed top-16 left-1/2 -translate-x-1/2 bg-card/95 border border-green-500/30 text-xs px-4 py-2 rounded-lg shadow-2xl z-40 flex items-center gap-2 text-green-binance transition-all duration-500 opacity-0 pointer-events-none">
        <i class="fa-solid fa-bolt"></i>
        <span id="popup-text">عملية شراء جديدة بقيمة 0.45 SOL</span>
    </div>

    <!-- Contract & Market Stats -->
    <div class="bg-darker px-4 py-2 flex items-center justify-between text-xs border-b border-custom text-gray-400">
        <div class="flex items-center gap-1.5 bg-card px-2.5 py-1 rounded border border-custom">
            <span class="text-gray-300">Ca: 7xKX...3m9P</span>
            <i class="fa-regular fa-copy cursor-pointer hover:text-white" onclick="showToast('✅ تم نسخ عنوان العقد بنجاح!')"></i>
        </div>
        <div class="flex gap-3">
            <span>MC: <strong class="text-white" id="mc-value">$48.9K</strong></span>
            <span>Liq: <strong class="text-white" id="liquid-value">$14.2K</strong></span>
        </div>
    </div>

    <!-- Price Bar -->
    <div class="bg-card px-4 py-3 flex justify-between items-center border-b border-custom">
        <div>
            <div class="text-[11px] text-gray-400">السعر الفوري الحالي</div>
            <div class="text-2xl font-black text-green-binance tracking-wider" id="live-price">$0.005841</div>
        </div>
        <div class="text-left">
            <span class="bg-green-binance/20 text-green-binance text-xs px-2.5 py-1 rounded font-bold">+142.8% 🟢</span>
        </div>
    </div>

    <!-- Interactive Simulated Chart -->
    <div class="relative w-full h-56 bg-card p-2 border-b border-custom flex flex-col justify-between overflow-hidden">
        <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
            <span class="text-7xl font-black tracking-widest text-white">BINANCE</span>
        </div>
        <div class="w-full h-40 flex items-end justify-between px-2 gap-1.5 pt-4">
            <div class="w-3 bg-red-binance h-12 rounded-sm"></div>
            <div class="w-3 bg-green-binance h-16 rounded-sm"></div>
            <div class="w-3 bg-red-binance h-10 rounded-sm"></div>
            <div class="w-3 bg-green-binance h-20 rounded-sm"></div>
            <div class="w-3 bg-green-binance h-28 rounded-sm"></div>
            <div class="w-3 bg-red-binance h-18 rounded-sm"></div>
            <div class="w-3 bg-green-binance h-36 rounded-sm relative shadow-lg shadow-green-500/20"></div>
            <div class="w-3 bg-green-binance h-40 rounded-sm"></div>
        </div>
        <div class="text-[10px] text-yellow-400 bg-black/60 px-2.5 py-1 rounded truncate border border-yellow-500/10" id="ticker-stream">
            📈 ضغط شرائي هائل على الشبكة - توقعات بانفجار السعر قريباً!
        </div>
    </div>

    <!-- User Balance Area -->
    <div class="bg-card px-4 py-3 flex justify-between items-center text-xs border-b border-custom">
        <span class="text-gray-400">رصيد محفظتك المعلق</span>
        <span class="font-bold text-white text-sm">$<span id="user-balance">0.00</span></span>
    </div>

    <!-- Bottom Actions Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-card p-3 border-t border-custom flex gap-3 items-center shadow-2xl z-50">
        <button onclick="handleTrade('sell')" class="flex-1 bg-red-binance text-white font-bold py-3 rounded-xl text-sm transition hover:opacity-90 shadow-lg">
            بيع (Sell)
        </button>
        <button onclick="handleTrade('buy')" class="flex-1 bg-green-binance text-black font-extrabold py-3 rounded-xl text-sm transition hover:opacity-90 shadow-lg">
            شراء (Buy)
        </button>
        <button onclick="connectUserWallet()" id="wallet-btn" class="bg-darker border border-custom px-4 py-3 rounded-xl text-yellow-400 hover:text-white flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-wallet text-sm"></i>
        </button>
    </div>

    <!-- Toast Notification Box -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-zinc-900 border border-custom text-white text-xs px-4 py-2 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        تنبيه النظام
    </div>

    <script>
        let balance = 0.00;
        let isWalletConnected = false;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }

        function connectUserWallet() {
            let userAddress = prompt("أدخل عنوان محفظتك (Phantom / MetaMask) لربطها فوراً:", "7xKX...3m9P");
            if(userAddress) {
                isWalletConnected = true;
                balance = 250.00;
                document.getElementById('user-balance').innerText = balance.toFixed(2);
                const statusBtn = document.getElementById('connection-status');
                statusBtn.innerText = "متصل";
                statusBtn.className = "text-xs text-green-binance bg-green-500/10 px-2.5 py-1 rounded-full border border-green-500/20";
                document.getElementById('wallet-btn').innerHTML = '<i class="fa-solid fa-circle-check text-green-binance text-sm"></i>';
                showToast("🎉 تم ربط المحفظة بنجاح كامل!");
            }
        }

        function handleTrade(type) {
            if(!isWalletConnected) {
                connectUserWallet();
                return;
            }

            if(type === 'buy') {
                let amount = prompt("أدخل مبلغ الشراء (مثال: 0.2 SOL):", "0.2");
                if(amount) {
                    balance += parseFloat(amount) * 320;
                    document.getElementById('user-balance').innerText = balance.toFixed(2);
                    showToast("🚀 تم تنفيذ أمر الشراء بنجاح ووصلت السيولة لمحفظتك!");
                }
            } else {
                let qty = prompt("كمية العملات المراد بيعها:", "1000");
                if(qty) {
                    showToast("💸 تم تنفيذ البيع وإضافة الأرباح لرصيدك بنجاح!");
                }
            }
        }

        const randomTraders = [
            "🔥 اشترى احدهم بقيمة 1.5 SOL",
            "⚡ صفقة شراء ضخمة بقيمة 3.2 SOL",
            "🚀 انضم مستثمر جديد بقيمة 0.8 SOL",
            "💎 حوت جديد يضخ 5.0 SOL في العملة"
        ];

        setInterval(() => {
            let randomPrice = (0.0058 + Math.random() * 0.0004).toFixed(6);
            document.getElementById('live-price').innerText = "$" + randomPrice;

            if(Math.random() > 0.5) {
                const popup = document.getElementById('live-trade-popup');
                document.getElementById('popup-text').innerText = randomTraders[Math.floor(Math.random() * randomTraders.length)];
                popup.style.opacity = '1';
                setTimeout(() => { popup.style.opacity = '0'; }, 3500);
            }
        }, 4500);
    </script>
</body>
</html>
