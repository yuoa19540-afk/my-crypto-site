<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Web3 - Live Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .bg-binance { background-color: #181a20; }
        .bg-sub { background-color: #1e2329; }
        .text-green-binance { color: #0ecb81; }
        .bg-green-binance { background-color: #0ecb81; }
        .text-red-binance { color: #f6465d; }
        .bg-red-binance { background-color: #f6465d; }
        .border-custom { border-color: #2b313a; }
        .tab-active { color: #f0b90b; border-bottom: 2px solid #f0b90b; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24">

    <!-- Top Header & Contract -->
    <header class="bg-binance px-3 py-2 border-b border-custom flex flex-col gap-1 sticky top-0 z-50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl">🐱</span>
                <span class="font-bold text-white text-sm">猫 / USDT</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400 bg-sub px-2 py-1 rounded border border-custom">
                <span>0x4e5b...1d4444</span>
                <i class="fa-regular fa-copy cursor-pointer hover:text-white" onclick="alert('تم نسخ عقد العملة بنجاح')"></i>
            </div>
        </div>

        <!-- Sub Tabs (السعر، المعلومات، البيانات...) -->
        <div class="flex justify-between text-xs text-gray-400 pt-1 border-t border-custom/50">
            <span class="tab-active pb-1 font-bold cursor-pointer">السعر</span>
            <span class="cursor-pointer hover:text-white">المعلومات</span>
            <span class="cursor-pointer hover:text-white">البيانات</span>
            <span class="cursor-pointer hover:text-white">التدقيق</span>
            <span class="cursor-pointer hover:text-white">Square</span>
        </div>
    </header>

    <!-- Price Stats Bar -->
    <div class="bg-binance px-4 py-2.5 flex justify-between items-center border-b border-custom">
        <div>
            <div class="text-[10px] text-gray-400">السعر الفوري</div>
            <div class="text-xl font-black text-green-binance font-mono tracking-wider" id="main-price">$0.0$<sub>4</sub>4421</div>
        </div>
        <div class="text-left">
            <span class="bg-green-binance/10 text-green-binance text-[11px] px-2 py-0.5 rounded font-bold border border-green-500/20">0%</span>
            <div class="text-[10px] text-gray-400 mt-1">MC: <span class="text-white font-bold">$4.42K</span> | Liq: <span class="text-white font-bold">$0.09</span></div>
        </div>
    </div>

    <!-- Timeframe Selector Bar (1ثانية، 1دقيقة، 3دقائق...) -->
    <div class="bg-sub px-2 py-1.5 flex justify-between items-center text-[11px] text-gray-400 border-b border-custom overflow-x-auto whitespace-nowrap">
        <span class="px-2 py-0.5 bg-binance text-white rounded font-bold">3 دقائق</span>
        <span class="px-2">1 دقيقة</span>
        <span class="px-2">5 دقائق</span>
        <span class="px-2">1 ساعة</span>
        <span class="px-2">المزيد <i class="fa-solid fa-caret-down"></i></span>
    </div>

    <!-- Technical Indicators Header (BOLL, EMA, MA) -->
    <div class="bg-binance px-3 py-1 text-[10px] text-gray-400 border-b border-custom flex justify-between items-center font-mono">
        <span>BOLL(20, 2) UP:- MB:- DN:-</span>
        <span class="text-yellow-400">MA(5): 6.3367</span>
    </div>

    <!-- Candlestick Simulation Chart Area -->
    <div class="relative w-full h-64 bg-binance p-2 border-b border-custom flex flex-col justify-between overflow-hidden">
        <!-- Background Binance Watermark -->
        <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
            <span class="text-6xl font-black tracking-widest text-white">BINANCE</span>
        </div>

        <!-- Candlesticks Grid -->
        <div class="w-full h-44 flex items-end justify-around gap-1 pt-4 relative px-2">
            <!-- Candle 1 -->
            <div class="w-2.5 flex flex-col items-center h-full justify-end">
                <div class="w-[1px] h-full bg-red-binance absolute"></div>
                <div class="w-2.5 bg-red-binance h-10 rounded-sm z-10"></div>
            </div>
            <!-- Candle 2 -->
            <div class="w-2.5 flex flex-col items-center h-full justify-end">
                <div class="w-[1px] h-full bg-green-binance absolute"></div>
                <div class="w-2.5 bg-green-binance h-16 rounded-sm z-10"></div>
            </div>
            <!-- Candle 3 (Massive Pump Candle matching user image) -->
            <div class="w-3 flex flex-col items-center h-full justify-end relative">
                <div class="w-[1px] h-full bg-green-binance absolute"></div>
                <div class="w-3 bg-green-binance h-36 rounded-sm z-10 shadow-lg shadow-green-500/30" id="live-pump-candle"></div>
            </div>
            <!-- Candle 4 (Correction Red Candle) -->
            <div class="w-2.5 flex flex-col items-center h-full justify-end">
                <div class="w-[1px] h-full bg-red-binance absolute"></div>
                <div class="w-2.5 bg-red-binance h-20 rounded-sm z-10" id="live-drop-candle"></div>
            </div>
        </div>

        <!-- Volume Chart at Bottom -->
        <div class="h-10 w-full flex items-end justify-around gap-1 pt-1 border-t border-custom/30 px-2">
            <div class="w-2 bg-red-binance/60 h-4"></div>
            <div class="w-2 bg-green-binance/60 h-6"></div>
            <div class="w-2 bg-green-binance h-10 animate-pulse"></div>
            <div class="w-2 bg-red-binance h-7"></div>
        </div>
    </div>

    <!-- Technical Bottom Stats (MA, Volume) -->
    <div class="bg-sub px-3 py-1 text-[10px] text-gray-400 flex justify-between border-b border-custom">
        <span>Vol: 5.1375</span>
        <span class="text-yellow-500">MA(10): 6.1573</span>
    </div>

    <!-- User Wallet Balance & Floating Stats -->
    <div class="bg-binance px-4 py-2.5 flex justify-between items-center text-xs border-b border-custom">
        <span class="text-gray-400">رصيدي $</span>
        <span class="font-bold text-white font-mono text-sm">&gt;0.01 <span id="user-balance" class="text-green-binance">0.01</span></span>
    </div>

    <!-- Bottom Actions (بيع / شراء / مبادلة) -->
    <div class="fixed bottom-0 left-0 right-0 bg-binance p-3 border-t border-custom flex gap-2 items-center shadow-2xl z-50">
        <button onclick="executeAction('sell')" class="flex-1 bg-red-binance/20 text-red-binance border border-red-500/30 font-bold py-3 rounded-xl text-xs transition active:scale-95">
            بيع
        </button>
        <button onclick="executeAction('buy')" class="flex-1 bg-green-binance text-black font-extrabold py-3 rounded-xl text-xs transition active:scale-95">
            شراء
        </button>
        <button onclick="executeAction('swap')" class="bg-sub border border-custom px-4 py-3 rounded-xl text-yellow-400 text-xs font-bold flex flex-col items-center">
            <i class="fa-solid fa-right-left text-sm"></i>
            <span class="text-[9px]">مبادلة</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-zinc-900 border border-custom text-white text-xs px-4 py-2 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        النظام نشط
    </div>

    <!-- Script Engine for Real-Time Ticks -->
    <script>
        let walletBalance = 0.01;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }

        function executeAction(type) {
            let address = prompt("أدخل عنوان محفظتك للمتابعة:", "7xKX...3m9P");
            if(address) {
                if(type === 'buy' || type === 'swap') {
                    let amount = prompt("أدخل المبلغ المراد ضخه:", "50");
                    if(amount) {
                        walletBalance += parseFloat(amount) * 2.5;
                        document.getElementById('user-balance').innerText = walletBalance.toFixed(2);
                        showToast("🚀 تم ربط العقد بنجاح وتم إرسال السيولة لمحفظتك!");
                    }
                } else {
                    showToast("💸 تم تنفيذ أمر البيع بنجاح وتحويل الأرباح!");
                }
            }
        }

        // محاكاة حركة الشموع والسعر الواقعية تماماً مثل باينانس
        setInterval(() => {
            let randomVar = (Math.random() * 0.00002).toFixed(6);
            let candleHeight = Math.floor(30 + Math.random() * 20);
            document.getElementById('live-pump-candle').style.height = candleHeight + 'px';
        }, 3000);
    </script>
</body>
</html>
